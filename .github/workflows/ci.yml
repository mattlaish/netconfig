name: CI

on:
  push:
  pull_request:

jobs:
  python-312:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: netconfig
          POSTGRES_PASSWORD: netconfig
          POSTGRES_DB: netconfig_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U netconfig"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install quality tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-quality.txt pytest 'psycopg[binary]'
      - name: Repository line-ending hygiene
        shell: bash
        run: |
          bad="$(git ls-files --eol | awk '$1 ~ /^i\/(crlf|mixed)$/ {print}')"
          if [ -n "$bad" ]; then
            printf '%s\n' "$bad"
            echo "Tracked CRLF/mixed line endings violate .gitattributes" >&2
            exit 1
          fi
      - name: Executable-mode integrity
        shell: bash
        run: |
          required=(
            usr/bin/netconfig
            packaging/build-rpm.sh
            packaging/install-rpm.sh
            packaging/inspect-rpm.sh
            packaging/q1-qualify-almalinux.sh
            packaging/q1-qualify-postgres.sh
            packaging/q1-source-gates.sh
            packaging/smoke-installed.sh
            tools/rpm-builder/build.sh
            tools/rpm-builder/verify.sh
            tools/rpm-builder/rpm_builder.py
            tools/rpm-builder/verify_rpm.py
          )
          for f in "${required[@]}"; do
            mode="$(git ls-files --stage -- "$f" | awk '{print $1}')"
            [ "$mode" = "100755" ] || { echo "Git index executable mode must be 100755: $f (got ${mode:-missing})" >&2; exit 1; }
            test -x "$f" || { echo "Worktree executable mode missing after checkout: $f" >&2; exit 1; }
          done
      - name: Ruff
        run: ruff check opt/netconfig/netconfig tests
      - name: Mypy security/core boundary
        run: >-
          mypy
          opt/netconfig/netconfig/security.py
          opt/netconfig/netconfig/credentials.py
          opt/netconfig/netconfig/configmodel.py
          opt/netconfig/netconfig/observability.py
          opt/netconfig/netconfig/protocols.py
          opt/netconfig/netconfig/storage_backend.py
          opt/netconfig/netconfig/postgres_core.py
          opt/netconfig/netconfig/postgres_backup.py
          opt/netconfig/netconfig/qualification.py
          opt/netconfig/netconfig/structured_changes.py
          opt/netconfig/netconfig/telemetry.py
          opt/netconfig/netconfig/vendor_models.py
          opt/netconfig/netconfig/desired_state.py
          opt/netconfig/netconfig/campaigns.py
          opt/netconfig/netconfig/ha.py
          opt/netconfig/netconfig/workflow.py
      - name: Compile all modules
        run: python -m compileall -q opt/netconfig/netconfig
      - name: Offline RPM builder reproducibility
        run: |
          rm -rf dist
          ./tools/rpm-builder/build.sh
          ./tools/rpm-builder/verify.sh ./dist/netconfig-2.0.0-42.el10.noarch.rpm
          first="$(sha256sum ./dist/netconfig-2.0.0-42.el10.noarch.rpm | awk '{print $1}')"
          rm ./dist/netconfig-2.0.0-42.el10.noarch.rpm
          ./tools/rpm-builder/build.sh
          second="$(sha256sum ./dist/netconfig-2.0.0-42.el10.noarch.rpm | awk '{print $1}')"
          test "$first" = "$second"
      - name: Pytest
        run: pytest
      - name: Legacy self-test compatibility
        run: PYTHONPATH=opt/netconfig python opt/netconfig/selftest.py
      - name: Install integration services
        run: |
          sudo apt-get update
          sudo apt-get install -y openssh-server snmpd postgresql-client
          python -m pip install 'psycopg[binary]'
      - name: Configure scripted SSH device
        run: |
          sudo cp tests/integration/fake_device_shell.py /usr/local/bin/netconfig-fake-device
          sudo chmod 0755 /usr/local/bin/netconfig-fake-device
          echo /usr/local/bin/netconfig-fake-device | sudo tee -a /etc/shells
          sudo useradd -m -s /usr/local/bin/netconfig-fake-device netops
          echo 'netops:netconfig' | sudo chpasswd
          sudo mkdir -p /run/sshd
          sudo /usr/sbin/sshd -p 2222 -o PasswordAuthentication=yes -o UsePAM=no -o PermitRootLogin=no
      - name: Configure Net-SNMP fake agent
        run: |
          printf 'agentaddress udp:127.0.0.1:1161\nrocommunity public 127.0.0.1\nsysLocation CI\nsysContact netconfig\n' > /tmp/snmpd.conf
          sudo /usr/sbin/snmpd -f -Lo -C -c /tmp/snmpd.conf > /tmp/snmpd.log 2>&1 &
          sleep 1
      - name: Protocol integration tier
        env:
          NETCONFIG_INTEGRATION: "1"
          NETCONFIG_POSTGRES_BACKUP_INTEGRATION: "1"
          NETCONFIG_TEST_PG_HOST: "127.0.0.1"
          NETCONFIG_TEST_PG_PORT: "5432"
          NETCONFIG_TEST_PG_DB: "netconfig_test"
          NETCONFIG_TEST_PG_USER: "netconfig"
          NETCONFIG_TEST_PG_PASSWORD: "netconfig"
          NETCONFIG_TEST_PG_SSLMODE: "disable"
        run: pytest -q tests/integration


  almalinux-10-rpm-build:
    runs-on: ubuntu-latest
    container:
      image: almalinux:10
    steps:
      - name: Install AlmaLinux build prerequisites
        run: >-
          dnf install -y
          git rpm-build rpm cpio findutils gzip tar systemd systemd-rpm-macros
          python3.12 python3.12-pip
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned Q-1 quality tools
        run: |
          python3.12 -m pip install --upgrade pip
          python3.12 -m pip install -r requirements-quality.txt pytest 'psycopg[binary]'
      - name: AlmaLinux 10 RPM build and static qualification
        run: ./packaging/q1-qualify-almalinux.sh
